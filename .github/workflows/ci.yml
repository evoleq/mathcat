name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: JVM, JS, Wasm and Linux Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and test portable targets
        run: |
          gradle --no-daemon \
            :mathcat-type-algebra:jvmTest :mathcat-type-algebra:jsNodeTest \
            :mathcat-type-algebra:wasmJsNodeTest :mathcat-type-algebra:linuxX64Test \
            :mathcat-core:jvmTest :mathcat-core:jsNodeTest \
            :mathcat-core:wasmJsNodeTest :mathcat-core:linuxX64Test \
            :mathcat-store:jvmTest :mathcat-store:jsNodeTest \
            :mathcat-store:wasmJsNodeTest :mathcat-store:linuxX64Test \
            :mathcat-actions:jvmTest :mathcat-actions:jsNodeTest \
            :mathcat-actions:wasmJsNodeTest :mathcat-actions:linuxX64Test \
            :mathcat-api:jvmTest :mathcat-api:jsNodeTest \
            :mathcat-api:wasmJsNodeTest :mathcat-api:linuxX64Test \
            :mathcat-ktorx:jvmTest :mathcat-ktorx:jsNodeTest \
            :mathcat-ktorx:wasmJsNodeTest :mathcat-ktorx:linuxX64Test \
            :mathcat-result:jvmTest :mathcat-result:jsNodeTest \
            :mathcat-result:wasmJsNodeTest :mathcat-result:linuxX64Test \
            :mathcat-context:test :mathcat-transform:test

  android:
    name: Android library compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK already present on GitHub runner
        run: |
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses > /dev/null || true
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile Android KMP targets
        run: gradle --no-daemon :mathcat-type-algebra:compileAndroidMain :mathcat-core:compileAndroidMain :mathcat-store:compileAndroidMain :mathcat-actions:compileAndroidMain :mathcat-api:compileAndroidMain :mathcat-ktorx:compileAndroidMain :mathcat-result:compileAndroidMain

  apple:
    name: iOS + macOS Native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile iOS targets and test macOS
        run: |
          gradle --no-daemon \
            :mathcat-type-algebra:compileKotlinIosArm64 :mathcat-type-algebra:compileKotlinIosSimulatorArm64 \
            :mathcat-type-algebra:macosX64Test \
            :mathcat-core:compileKotlinIosArm64 :mathcat-core:compileKotlinIosSimulatorArm64 \
            :mathcat-core:macosX64Test \
            :mathcat-store:compileKotlinIosArm64 :mathcat-store:compileKotlinIosSimulatorArm64 \
            :mathcat-store:macosX64Test \
            :mathcat-actions:compileKotlinIosArm64 :mathcat-actions:compileKotlinIosSimulatorArm64 \
            :mathcat-actions:macosX64Test \
            :mathcat-api:compileKotlinIosArm64 :mathcat-api:compileKotlinIosSimulatorArm64 \
            :mathcat-api:macosX64Test \
            :mathcat-ktorx:compileKotlinIosArm64 :mathcat-ktorx:compileKotlinIosSimulatorArm64 \
            :mathcat-ktorx:macosX64Test \
            :mathcat-result:compileKotlinIosArm64 :mathcat-result:compileKotlinIosSimulatorArm64 \
            :mathcat-result:macosX64Test

  windows:
    name: Windows Native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Test mingwX64
        shell: pwsh
        run: gradle --no-daemon :mathcat-type-algebra:mingwX64Test :mathcat-core:mingwX64Test :mathcat-store:mingwX64Test :mathcat-actions:mingwX64Test :mathcat-api:mingwX64Test :mathcat-ktorx:mingwX64Test :mathcat-result:mingwX64Test
