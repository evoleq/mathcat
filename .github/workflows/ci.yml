name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: JVM, JS, Wasm and Linux Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Validate compatibility manifest and release planner
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release.py validate
      - name: Compile and test portable targets
        run: |
          gradle --no-daemon \
            :toolkit-type-algebra:jvmTest :toolkit-type-algebra:jsNodeTest \
            :toolkit-type-algebra:wasmJsNodeTest :toolkit-type-algebra:linuxX64Test \
            :toolkit-core:jvmTest :toolkit-core:jsNodeTest \
            :toolkit-core:wasmJsNodeTest :toolkit-core:linuxX64Test \
            :toolkit-store:jvmTest :toolkit-store:jsNodeTest \
            :toolkit-store:wasmJsNodeTest :toolkit-store:linuxX64Test \
            :toolkit-actions:jvmTest :toolkit-actions:jsNodeTest \
            :toolkit-actions:wasmJsNodeTest :toolkit-actions:linuxX64Test \
            :toolkit-api:jvmTest \
            :toolkit-api:jsNodeTest \
            :toolkit-api:wasmJsNodeTest \
            :toolkit-api:linuxX64Test \
            :toolkit-result:jvmTest \
            :toolkit-result:jsNodeTest \
            :toolkit-result:wasmJsNodeTest \
            :toolkit-result:linuxX64Test \
            :toolkit-serialization:jvmTest \
            :toolkit-serialization:jsNodeTest \
            :toolkit-serialization:wasmJsNodeTest \
            :toolkit-serialization:linuxX64Test \
            :toolkit-ktorx:jvmTest \
            :toolkit-ktorx:jsNodeTest \
            :toolkit-ktorx:wasmJsNodeTest \
            :toolkit-ktorx:linuxX64Test \
            :toolkit-middleware:jvmTest :toolkit-middleware:jsNodeTest \
            :toolkit-middleware:wasmJsNodeTest :toolkit-middleware:linuxX64Test \
            :toolkit-plugins:jvmTest :toolkit-plugins:jsNodeTest \
            :toolkit-plugins:wasmJsNodeTest :toolkit-plugins:linuxX64Test \
            :toolkit-plugins-actions:jvmTest :toolkit-plugins-actions:jsNodeTest \
            :toolkit-plugins-actions:wasmJsNodeTest :toolkit-plugins-actions:linuxX64Test \
            :toolkit-routing:jvmTest :toolkit-routing:jsNodeTest \
            :toolkit-routing:wasmJsNodeTest :toolkit-routing:linuxX64Test \
            :toolkit-evolution:jvmTest :toolkit-evolution:jsNodeTest \
            :toolkit-evolution:wasmJsNodeTest :toolkit-evolution:linuxX64Test \
            :toolkit-evolution-runtime:jvmTest :toolkit-evolution-runtime:jsNodeTest \
            :toolkit-evolution-runtime:wasmJsNodeTest :toolkit-evolution-runtime:linuxX64Test \
            :toolkit-serialization-ksp-fixture:test :toolkit-context:test :toolkit-transform:test

  android:
    name: Android library compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK already present on GitHub runner
        run: |
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses > /dev/null || true
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile Android KMP targets
        run: gradle --no-daemon :toolkit-type-algebra:compileAndroidMain :toolkit-core:compileAndroidMain :toolkit-store:compileAndroidMain :toolkit-actions:compileAndroidMain :toolkit-api:compileAndroidMain :toolkit-result:compileAndroidMain :toolkit-serialization:compileAndroidMain :toolkit-ktorx:compileAndroidMain :toolkit-middleware:compileAndroidMain :toolkit-plugins:compileAndroidMain :toolkit-plugins-actions:compileAndroidMain :toolkit-routing:compileAndroidMain :toolkit-evolution:compileAndroidMain :toolkit-evolution-runtime:compileAndroidMain

  apple:
    name: iOS + macOS Native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile iOS targets and test macOS
        run: |
          gradle --no-daemon \
            :toolkit-type-algebra:compileKotlinIosArm64 :toolkit-type-algebra:compileKotlinIosSimulatorArm64 \
            :toolkit-type-algebra:macosX64Test \
            :toolkit-core:compileKotlinIosArm64 :toolkit-core:compileKotlinIosSimulatorArm64 \
            :toolkit-core:macosX64Test \
            :toolkit-store:compileKotlinIosArm64 :toolkit-store:compileKotlinIosSimulatorArm64 \
            :toolkit-store:macosX64Test \
            :toolkit-actions:compileKotlinIosArm64 :toolkit-actions:compileKotlinIosSimulatorArm64 \
            :toolkit-actions:macosX64Test \
            :toolkit-api:compileKotlinIosArm64 \
            :toolkit-api:compileKotlinIosSimulatorArm64 \
            :toolkit-api:macosX64Test \
            :toolkit-result:compileKotlinIosArm64 \
            :toolkit-result:compileKotlinIosSimulatorArm64 \
            :toolkit-result:macosX64Test \
            :toolkit-serialization:compileKotlinIosArm64 \
            :toolkit-serialization:compileKotlinIosSimulatorArm64 \
            :toolkit-serialization:macosX64Test \
            :toolkit-ktorx:compileKotlinIosArm64 \
            :toolkit-ktorx:compileKotlinIosSimulatorArm64 \
            :toolkit-ktorx:macosX64Test \
            :toolkit-middleware:compileKotlinIosArm64 \
            :toolkit-middleware:compileKotlinIosSimulatorArm64 \
            :toolkit-middleware:macosX64Test \
            :toolkit-plugins:compileKotlinIosArm64 \
            :toolkit-plugins:compileKotlinIosSimulatorArm64 \
            :toolkit-plugins:macosX64Test \
            :toolkit-plugins-actions:compileKotlinIosArm64 \
            :toolkit-plugins-actions:compileKotlinIosSimulatorArm64 \
            :toolkit-plugins-actions:macosX64Test \
            :toolkit-routing:compileKotlinIosArm64 :toolkit-routing:compileKotlinIosSimulatorArm64 \
            :toolkit-routing:macosX64Test \
            :toolkit-evolution:compileKotlinIosArm64 :toolkit-evolution:compileKotlinIosSimulatorArm64 \
            :toolkit-evolution:macosX64Test \
            :toolkit-evolution-runtime:compileKotlinIosArm64 :toolkit-evolution-runtime:compileKotlinIosSimulatorArm64 \
            :toolkit-evolution-runtime:macosX64Test

  windows:
    name: Windows Native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Test mingwX64
        shell: pwsh
        run: gradle --no-daemon :toolkit-type-algebra:mingwX64Test :toolkit-core:mingwX64Test :toolkit-store:mingwX64Test :toolkit-actions:mingwX64Test :toolkit-api:mingwX64Test :toolkit-result:mingwX64Test :toolkit-serialization:mingwX64Test :toolkit-ktorx:mingwX64Test :toolkit-middleware:mingwX64Test :toolkit-plugins:mingwX64Test :toolkit-plugins-actions:mingwX64Test :toolkit-routing:mingwX64Test :toolkit-evolution:mingwX64Test :toolkit-evolution-runtime:mingwX64Test
  
  publication:
    name: Publish JVM variants and compile an external consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Publish KMP root and JVM variants to Maven Local with JitPack coordinates
        env:
          JITPACK: 'true'
          VERSION: 'v0.0.0-smoke'
        run: |
          gradle --no-daemon \
            :toolkit-type-algebra:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-type-algebra:publishJvmPublicationToMavenLocal \
            :toolkit-core:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-core:publishJvmPublicationToMavenLocal \
            :toolkit-store:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-store:publishJvmPublicationToMavenLocal \
            :toolkit-actions:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-actions:publishJvmPublicationToMavenLocal \
            :toolkit-api:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-api:publishJvmPublicationToMavenLocal \
            :toolkit-result:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-result:publishJvmPublicationToMavenLocal \
            :toolkit-serialization:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-serialization:publishJvmPublicationToMavenLocal \
            :toolkit-ktorx:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-ktorx:publishJvmPublicationToMavenLocal \
            :toolkit-middleware:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-middleware:publishJvmPublicationToMavenLocal \
            :toolkit-plugins:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-plugins:publishJvmPublicationToMavenLocal \
            :toolkit-plugins-actions:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-plugins-actions:publishJvmPublicationToMavenLocal \
            :toolkit-routing:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-routing:publishJvmPublicationToMavenLocal \
            :toolkit-evolution:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-evolution:publishJvmPublicationToMavenLocal \
            :toolkit-evolution-runtime:publishKotlinMultiplatformPublicationToMavenLocal \
            :toolkit-evolution-runtime:publishJvmPublicationToMavenLocal \
            :toolkit-context:publishToMavenLocal \
            :toolkit-transform:publishToMavenLocal \
            :toolkit-serialization-ksp:publishToMavenLocal
      - name: Verify Maven metadata and internal coordinates
        run: python3 scripts/verify_published_jvm.py v0.0.0-smoke
      - name: Compile independent JVM consumer using Maven Local
        run: gradle --no-daemon -p publishing-smoke compileKotlin
