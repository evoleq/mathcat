name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Kotlin Multiplatform (JVM + JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Run JVM and Node.js tests
        run: gradle --no-daemon :mathcat-type-algebra:jvmTest :mathcat-type-algebra:jsNodeTest :mathcat-core:jvmTest :mathcat-core:jsNodeTest
